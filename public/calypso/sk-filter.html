<!-- pl4y-bar.html — barre de navigation commune aux docs + bascule de theme.
     Injectee en haut du <body> de chaque page generee. -->
<div class="pl4y-bar">
  <a class="pl4y-home" href="/">pl4y<span class="dot">.</span>store</a>
  <nav>
    <a href="/" data-pl4y-nav="/">Accueil</a>
    <a href="/wiki" data-pl4y-nav="/wiki">Installeur &amp; wiki</a>
    <a href="/calypso/" data-pl4y-nav="/calypso/">QEMU Calypso</a>
    <a href="/osmo_egprs/" data-pl4y-nav="/osmo_egprs/">osmo_egprs</a>
    <a href="/tests/" data-pl4y-nav="/tests/">Tests</a>
    <a href="/sdr/" data-pl4y-nav="/sdr/">SDR</a>
    <a href="/bbaranoff/" data-pl4y-nav="/bbaranoff/">Cours &amp; CTF</a>
  </nav>
  <span class="spacer"></span>
  <button class="pl4y-toggle" type="button" aria-label="Basculer le theme clair / sombre">&#127769; Theme</button>
</div>
<script>
  (function () {
    var root = document.documentElement;
    var btn = document.querySelector(".pl4y-toggle");
    function label() {
      if (!btn) return;
      var light = root.getAttribute("data-theme") === "light";
      btn.innerHTML = light ? "☀️ Clair" : "🌙 Sombre";
    }
    label();
    if (btn) {
      btn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("pl4y-theme", next); } catch (e) {}
        label();
      });
    }
    // marque l'onglet courant
    var path = location.pathname;
    document.querySelectorAll("[data-pl4y-nav]").forEach(function (a) {
      var p = a.getAttribute("data-pl4y-nav");
      if (p !== "/" && path.indexOf(p) === 0) a.setAttribute("aria-current", "page");
      if (p === "/" && path === "/") a.setAttribute("aria-current", "page");
    });
  })();
</script>

<!-- pl4y-head.html — applique le theme AVANT le premier rendu (pas de flash).
     Meme cle localStorage que la page principale : "pl4y-theme". -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("pl4y-theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="pl4y-doc.css">
<script>
document.addEventListener('DOMContentLoaded', function () {
  var box = document.getElementById('sk-filter');
  if (!box) return;
  var rows = Array.from(document.querySelectorAll('.bundle-index tbody tr'));
  var toc  = Array.from(document.querySelectorAll('#TOC a, nav[role=doc-toc] a'));
  box.addEventListener('input', function () {
    var q = box.value.trim().toLowerCase();
    rows.forEach(function (r) {
      r.style.display = (!q || r.textContent.toLowerCase().includes(q)) ? '' : 'none';
    });
    toc.forEach(function (a) {
      var li = a.closest('li') || a;
      li.style.display = (!q || a.textContent.toLowerCase().includes(q)) ? '' : 'none';
    });
  });
});
</script>
