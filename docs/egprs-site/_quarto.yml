project:
  type: website
  output-dir: _site

website:
  title: "osmo_egprs"
  search:
    location: sidebar
    type: textbox
  sidebar:
    style: floating
    collapse-level: 1
    contents:
      - text: "Index"
        href: index.qmd
      - section: "1 - Documentation"
        contents:
          - href: sec1-01.qmd
            text: "partie 1"
      - section: "5 - Python"
        contents:
          - href: sec5-01.qmd
            text: "partie 1"
      - section: "6 - Shell"
        contents:
          - href: sec6-01.qmd
            text: "partie 1"
          - href: sec6-02.qmd
            text: "partie 2"

execute:
  enabled: false
  freeze: false

format:
  html:
    theme: [cosmo]
    toc: true
    toc-depth: 2
    toc-location: right
    toc-title: "Fichiers"
    number-sections: false
    anchor-sections: true
    smooth-scroll: true
    code-copy: true
    code-overflow: scroll
    code-block-bg: true
    highlight-style: arrow
    embed-resources: false
    include-after-body: sk-filter.html
    mermaid:
      theme: neutral
